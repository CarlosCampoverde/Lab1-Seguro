name: 🔒 Security Pipeline CI/CD

on:
  pull_request:
    branches: [ test ]
    types: [ opened, synchronize, reopened ]

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  PYTHON_VERSION: '3.11'

jobs:
  security-scan:
    name: 🛡️ Análisis de Seguridad con IA
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 📢 Notificar inicio de análisis
        run: |
          python telegram_notifier.py \
            --message "🔍 Iniciando análisis de seguridad en PR #${{ github.event.pull_request.number }}" \
            --status "info"
      
      - name: 🔍 Obtener archivos modificados
        id: changed-files
        uses: tj-actions/changed-files@v41
        with:
          files: |
            **/*.py
            **/*.js
            **/*.java
            **/*.php
            **/*.c
            **/*.cpp
            **/*.go
            **/*.rb
      
      - name: 🤖 Analizar código con modelo IA
        id: ai-scan
        run: |
          echo "Archivos modificados: ${{ steps.changed-files.outputs.all_changed_files }}"
          
          # Si no hay archivos, crear JSON vacío
          if [ -z "${{ steps.changed-files.outputs.all_changed_files }}" ]; then
            echo "No hay archivos de código modificados"
            echo '{"total_files": 0, "scanned": 0, "vulnerable": 0, "safe": 0, "has_vulnerabilities": false, "vulnerabilities": [], "files": []}' > scan_results.json
          else
            # Ejecutar análisis de vulnerabilidades
            python ci_security_scanner.py \
              --files "${{ steps.changed-files.outputs.all_changed_files }}" \
              --pr-number "${{ github.event.pull_request.number }}" \
              --output-json scan_results.json || echo '{"total_files": 0, "scanned": 0, "vulnerable": 0, "safe": 0, "has_vulnerabilities": false, "vulnerabilities": [], "files": []}' > scan_results.json
          fi
        continue-on-error: true
      
      - name: 📊 Procesar resultados
        id: process-results
        run: |
          python process_scan_results.py \
            --input scan_results.json \
            --threshold 0.70
      
      - name: 🚨 Comentar en PR si hay vulnerabilidades
        if: steps.process-results.outputs.has_vulnerabilities == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('scan_results.json', 'utf8'));
            
            let comment = '## 🚨 Vulnerabilidades Detectadas por IA\n\n';
            comment += `**Modelo:** XGBoost Multi-Lenguaje (Accuracy: 82%)\n\n`;
            
            results.vulnerabilities.forEach(vuln => {
              comment += `### ⚠️ ${vuln.file}\n`;
              comment += `- **Probabilidad:** ${vuln.probability}%\n`;
              comment += `- **Tipo:** ${vuln.type}\n`;
              comment += `- **Línea:** ${vuln.line}\n`;
              comment += `- **Razón:** ${vuln.reason}\n\n`;
            });
            
            comment += '\n**Acción requerida:** Este PR será bloqueado hasta que se corrijan las vulnerabilidades.\n';
            comment += '\n---\n*Análisis automatizado por modelo de Minería de Datos - No LLM*';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
      
      - name: 🏷️ Etiquetar PR como vulnerable
        if: steps.process-results.outputs.has_vulnerabilities == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['fixing-required', 'security-issue']
            });
      
      - name: 📢 Notificar vulnerabilidades vía Telegram
        if: steps.process-results.outputs.has_vulnerabilities == 'true'
        run: |
          python telegram_notifier.py \
            --message "🚨 VULNERABILIDADES DETECTADAS en PR #${{ github.event.pull_request.number }}" \
            --file scan_results.json \
            --status "error"
      
      - name: ❌ Fallar el job si hay vulnerabilidades
        if: steps.process-results.outputs.has_vulnerabilities == 'true'
        run: |
          echo "::error::Código vulnerable detectado. PR bloqueado."
          exit 1
      
      - name: ✅ Notificar código seguro
        if: steps.process-results.outputs.has_vulnerabilities == 'false'
        run: |
          python telegram_notifier.py \
            --message "✅ Código SEGURO verificado en PR #${{ github.event.pull_request.number }}" \
            --status "success"

  tests:
    name: 🧪 Pruebas Unitarias
    needs: security-scan
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: 📦 Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: 🧪 Ejecutar tests
        run: |
          pytest tests/ --cov=. --cov-report=xml --cov-report=term
      
      - name: 📢 Notificar resultado de tests
        if: always()
        run: |
          if [ $? -eq 0 ]; then
            python telegram_notifier.py \
              --message "✅ Tests pasados en PR #${{ github.event.pull_request.number }}" \
              --status "success"
          else
            python telegram_notifier.py \
              --message "❌ Tests fallidos en PR #${{ github.event.pull_request.number }}" \
              --status "error"
          fi

  auto-merge-to-test:
    name: 🔀 Merge Automático a Test
    needs: [security-scan, tests]
    runs-on: ubuntu-latest
    if: success()
    
    steps:
      - name: ✅ Auto-merge PR
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              merge_method: 'squash'
            });
      
      - name: 📢 Notificar merge exitoso
        run: |
          python telegram_notifier.py \
            --message "🔀 PR #${{ github.event.pull_request.number }} mergeado automáticamente a TEST" \
            --status "success"

  deploy-production:
    name: 🚀 Deploy a Producción
    needs: auto-merge-to-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/test'
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐳 Build Docker image
        run: |
          docker build -t vulnerability-scanner:latest .
      
      - name: 🚀 Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          # Deploy automático a Render
          curl -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json"
      
      - name: 📢 Notificar despliegue exitoso
        run: |
          python telegram_notifier.py \
            --message "🚀 Despliegue EXITOSO a producción desde PR #${{ github.event.pull_request.number }}" \
            --status "success" \
            --url "${{ secrets.PRODUCTION_URL }}"
